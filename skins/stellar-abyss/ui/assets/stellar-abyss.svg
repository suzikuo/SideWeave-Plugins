    <g clip-path="url(#planet-clip)" opacity=".43" fill="none" stroke="#b6eeff">
      <path d="M1315 343c115 38 278 54 386 23M1318 399c128 45 285 52 389 16M1332 456c110 36 249 43 356 7M1381 513c96 21 181 19 279-11" stroke-width="2"/>
