<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#030611"/>
      <stop offset=".48" stop-color="#09132a"/>
      <stop offset="1" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="nebula-cyan">
      <stop stop-color="#36d9ff" stop-opacity=".42"/>
      <stop offset=".38" stop-color="#247bd6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#132d83" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-violet">
