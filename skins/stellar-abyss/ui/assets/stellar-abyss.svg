      <circle cx="103" cy="119" r=".5" fill="#fff" opacity=".56"/>
      <circle cx="81" cy="31" r=".6" fill="#9abaff" opacity=".66"/>
    </pattern>
    <pattern id="distant-stars" width="283" height="221" patternUnits="userSpaceOnUse">
