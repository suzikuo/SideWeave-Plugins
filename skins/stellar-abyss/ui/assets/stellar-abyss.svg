    </g>
    <ellipse cx="1512" cy="390" rx="244" ry="63" fill="none" stroke="url(#planet-rim)" stroke-width="7" transform="rotate(-17 1512 390)" opacity=".68"/>
    <ellipse cx="1512" cy="390" rx="266" ry="72" fill="none" stroke="#8b87ff" stroke-opacity=".16" stroke-width="1" transform="rotate(-17 1512 390)"/>
    <path d="M1304 486c60 56 134 90 215 100" fill="none" stroke="#5bdfff" stroke-opacity=".25" stroke-width="2" filter="url(#glow)"/>
