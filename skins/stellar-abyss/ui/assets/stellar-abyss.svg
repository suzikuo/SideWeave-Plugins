      <stop offset=".16" stop-color="#72d8ff"/>
      <stop offset=".56" stop-color="#28538d"/>
      <stop offset="1" stop-color="#10152f"/>
    </radialGradient>
    <linearGradient id="planet-rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e1fbff" stop-opacity=".82"/>
      <stop offset=".38" stop-color="#67cfff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8f61ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fine-stars" width="173" height="139" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="20" r="1.1" fill="#e8f8ff" opacity=".78"/>
      <circle cx="64" cy="95" r=".75" fill="#b8dfff" opacity=".66"/>
      <circle cx="127" cy="42" r=".95" fill="#fff" opacity=".76"/>
      <circle cx="157" cy="121" r=".65" fill="#8ce7ff" opacity=".72"/>
