[package]
name = "sideweave_plugin-toolbox"
version = "1.0.3"
edition = "2021"
description = "Toolbox native adapter for SideWeave"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sideweave-plugin-api = { workspace = true }
sideweave-plugin-sdk = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rqrr = "0.7"
serde_json = "1"
