<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player - Detail</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      color-scheme: dark;
      --accent: #4d80ff;
      --bg: #09090b;
      --surface: #101113;
      --surface-subtle: #18191b;
      --surface-container: #232428;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --border: #292a2e;
      --border-strong: #45464d;
      --radius: 8px;
      --font-ui: Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow-y: auto;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .banner {
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .banner-icon {
      font-size: 26px;
      line-height: 1;
    }

    .banner-content h4 {
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .banner-content p {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .vinyl-large {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #333 15%, #18181b 16%, #18181b 35%, #27272a 36%, #27272a 45%, #18181b 46%, #18181b 65%, #27272a 66%, #18181b 80%, #09090b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 3px solid var(--border);
      transition: transform 0.5s ease;
    }

    .vinyl-large.playing {
      animation: spin 6s linear infinite;
    }

    .vinyl-center-large {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vinyl-hole-large {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #000;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .info-section {
      text-align: center;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .artist {
      font-size: 13px;
      color: var(--text-muted);
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--surface-container);
      border-radius: 999px;
      cursor: pointer;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.15s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .ctrl-btn:hover {
      background: var(--surface-container);
      border-color: var(--border-strong);
      transform: scale(1.05);
    }

    .play-btn-large {
      width: 52px;
      height: 52px;
      background: var(--accent);
      color: #fff;
      border: none;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 40%, transparent);
    }

    .play-btn-large:hover {
      background: var(--accent);
      filter: brightness(1.1);
      transform: scale(1.08);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* Playlist */
    .playlist-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .track-item:hover {
      background: var(--surface-container);
      border-color: var(--border-strong);
      transform: translateX(3px);
    }

    .track-item.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 15%, var(--surface));
    }

    .track-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-idx {
      font-size: 12px;
      color: var(--text-muted);
      width: 18px;
    }

    .track-item.active .item-idx {
      color: var(--accent);
      font-weight: 700;
    }

    .item-title {
      font-size: 13px;
      font-weight: 500;
    }

    .item-artist {
      font-size: 11px;
      color: var(--text-muted);
    }

    .item-duration {
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="banner-icon">✨</div>
    <div class="banner-content">
      <h4>Music Player (Custom 悬浮预览示例)</h4>
      <p>本插件为标准的 <code>web_sandbox</code> 插件，配置了 <code>entry: "preview.html"</code>。鼠标悬停在侧边栏图标上即可触发轻量级独立沙箱悬浮窗。</p>
    </div>
  </div>

  <div class="player-card">
    <div class="vinyl-large" id="vinyl">
      <div class="vinyl-center-large">
        <div class="vinyl-hole-large"></div>
      </div>
    </div>

    <div class="info-section">
      <div class="title" id="title">Moonlight Sonata (Lofi Mix)</div>
      <div class="artist" id="artist">Agile Ambient Records</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill" style="width: 20%;"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">00:00</span>
        <span id="duration">03:42</span>
      </div>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="prevBtn" title="上一首">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5"></line>
        </svg>
      </button>

      <button class="ctrl-btn play-btn-large" id="playBtn" title="播放 / 暂停">
        <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
        <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display: none;">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
      </button>

      <button class="ctrl-btn" id="nextBtn" title="下一首">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="playlist-section">
    <div class="section-title">歌曲列表</div>
    <div id="playlist"></div>
  </div>

  <script>
    const TRACKS = [
      { title: "Moonlight Sonata (Lofi)", artist: "Agile Ambient Records", duration: 222 },
      { title: "Cyber Sunset Cafe", artist: "Synthwave Breeze", duration: 195 },
      { title: "Midnight Coding Session", artist: "Deep Focus Flow", duration: 240 },
      { title: "Morning Rain & Coffee", artist: "Acoustic Whispers", duration: 180 }
    ];

    let state = {
      trackIndex: 0,
      isPlaying: true,
      currentTime: 45
    };

    const vinyl = document.getElementById('vinyl');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const playlistEl = document.getElementById('playlist');

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function render() {
      const cur = TRACKS[state.trackIndex];
      titleEl.textContent = cur.title;
      artistEl.textContent = cur.artist;
      durationEl.textContent = formatTime(cur.duration);
      currentTimeEl.textContent = formatTime(state.currentTime);

      const percent = (state.currentTime / cur.duration) * 100;
      progressFill.style.width = `${Math.min(100, Math.max(0, percent))}%`;

      if (state.isPlaying) {
        vinyl.classList.add('playing');
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        vinyl.classList.remove('playing');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }

      // 渲染列表
      playlistEl.innerHTML = '';
      TRACKS.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = `track-item ${idx === state.trackIndex ? 'active' : ''}`;
        row.innerHTML = `
          <div class="track-item-left">
            <span class="item-idx">${idx + 1}</span>
            <div>
              <div class="item-title">${item.title}</div>
              <div class="item-artist">${item.artist}</div>
            </div>
          </div>
          <div class="item-duration">${formatTime(item.duration)}</div>
        `;
        row.onclick = () => {
          state.trackIndex = idx;
          state.currentTime = 0;
          state.isPlaying = true;
          render();
          saveState();
        };
        playlistEl.appendChild(row);
      });
    }

    function togglePlay() {
      state.isPlaying = !state.isPlaying;
      render();
      saveState();
    }

    function nextTrack() {
      state.trackIndex = (state.trackIndex + 1) % TRACKS.length;
      state.currentTime = 0;
      render();
      saveState();
    }

    function prevTrack() {
      state.trackIndex = (state.trackIndex - 1 + TRACKS.length) % TRACKS.length;
      state.currentTime = 0;
      render();
      saveState();
    }

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      state.currentTime = Math.floor(ratio * TRACKS[state.trackIndex].duration);
      render();
      saveState();
    });

    playBtn.onclick = togglePlay;
    nextBtn.onclick = nextTrack;
    prevBtn.onclick = prevTrack;

    let progressTimer = 0;
    function startProgressTimer() {
      if (progressTimer) return;
      progressTimer = window.setInterval(() => {
        if (state.isPlaying) {
          state.currentTime += 1;
          if (state.currentTime >= TRACKS[state.trackIndex].duration) {
            nextTrack();
          } else {
            render();
          }
        }
      }, 1000);
    }

    function stopProgressTimer() {
      window.clearInterval(progressTimer);
      progressTimer = 0;
    }

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (
        event.source !== window.parent ||
        data?.__agileTiles !== true ||
        data.type !== 'lifecycle' ||
        data.plugin_id !== 'demo_music' ||
        typeof data.active !== 'boolean'
      ) return;
      if (data.active) startProgressTimer();
      else stopProgressTimer();
    });

    function saveState() {
      if (window.agileTiles && window.agileTiles.storage) {
        window.agileTiles.storage.set('music_state', JSON.stringify(state)).catch(() => {});
      }
    }

    function loadState() {
      if (window.agileTiles && window.agileTiles.storage) {
        window.agileTiles.storage.get('music_state').then(val => {
          if (val) {
            try {
              const parsed = JSON.parse(val);
              Object.assign(state, parsed);
              render();
            } catch (e) {}
          }
        }).catch(() => {});
      }
    }

    // 主题同步
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.__agileTiles !== true) return;
      if (d.type === 'theme' && d.theme) {
        const root = document.documentElement;
        if (d.theme.variables) {
          for (const [k, v] of Object.entries(d.theme.variables)) {
            if (k.startsWith('--')) root.style.setProperty(k, v);
          }
        }
        if (d.theme.theme) root.dataset.theme = d.theme.theme;
        if (d.theme.skin) root.dataset.skin = d.theme.skin;
      }
    });

    loadState();
    render();
    if (window.parent === window) startProgressTimer();
  </script>
</body>
</html>
