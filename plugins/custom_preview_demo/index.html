<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自定义预览演示</title>
  <style>
    :root { color-scheme: dark; font-family: Inter,"Segoe UI Variable","Segoe UI","Microsoft YaHei",system-ui,sans-serif; --accent:#4d80ff; --bg:#09090b; --surface:#101113; --text:#fafafa; --muted:#a1a1aa; --border:#292a2e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:30px; color:var(--text); background:var(--bg); }
    main { max-width:680px; margin:auto; }
    .tag { color:var(--accent); font-size:11px; font-weight:600; letter-spacing:.08em; }
    h1 { margin:10px 0 8px; font-size:24px; font-weight:650; letter-spacing:-.025em; }
    p { color:var(--muted); line-height:1.7; }
    section { margin-top:24px; padding:20px; border:1px solid var(--border); border-radius:10px; background:var(--surface); box-shadow:0 12px 28px #0003; }
    li { margin:12px 0; color:var(--muted); line-height:1.55; }
    code { color:var(--accent); font:12px Consolas,monospace; }
    ::selection { color:#fff; background:color-mix(in srgb,var(--accent) 78%,transparent); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    @media (prefers-color-scheme:light) { :root { color-scheme:light; --accent:#3370ff; --bg:#fafafa; --surface:#fff; --text:#09090b; --muted:#71717a; --border:#e4e4e7; } section { box-shadow:0 8px 22px #18181b14; } }
  </style>
</head>
<body>
  <main>
    <div class="tag">PLUGIN PREVIEW PLAYGROUND</div>
    <h1>自定义悬浮预览</h1>
    <p>此插件使用独立 HTML 页面绘制悬浮卡片。卡片布局和交互由插件控制，不依赖宿主的通用预览模板。</p>
    <section>
      <div class="tag">如何测试</div>
      <ol>
        <li>回到侧边栏，悬停在“自定义预览演示”图标上。</li>
        <li>点击卡片里的“完成一轮”，查看插件自己的交互状态。</li>
        <li>点击“收起预览”，验证插件向宿主发送关闭消息。</li>
      </ol>
      <p>清单入口：<code>hoverPreview.entry = preview.html</code>。预览运行在受限 iframe 中，并接收宿主主题变量。</p>
    </section>
  </main>
</body>
</html>
