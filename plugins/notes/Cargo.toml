[package]
name = "sideweave_plugin-notes"
version = "1.0.5"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sideweave-plugin-api = { workspace = true }
sideweave-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
