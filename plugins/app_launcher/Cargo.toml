[package]
name = "sideweave_plugin-app-launcher"
version = "1.0.4"
edition = "2021"
description = "Application launcher plugin for SideWeave"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sideweave-plugin-api = { workspace = true }
sideweave-plugin-sdk = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
