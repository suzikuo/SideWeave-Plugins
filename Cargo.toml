[workspace]
resolver = "2"
members = [
    "plugins/app_launcher",
    "plugins/bookmarks",
    "plugins/clipboard",
    "plugins/cloudflare_tunnel",
    "plugins/native-template",
    "plugins/notes",
    "plugins/notification-lab",
    "plugins/port_forward",
    "plugins/screenshot-core",
    "plugins/ssh-process",
    "plugins/ssh_manager",
    "plugins/thiefbook",
    "plugins/time",
    "plugins/toolbox",
]

[workspace.dependencies]
sideweave-plugin-api = { package = "sideweave-plugin-api", git = "https://github.com/suzikuo/SideWeave.git", branch = "master" }
sideweave-plugin-sdk = { package = "sideweave-plugin-sdk", git = "https://github.com/suzikuo/SideWeave.git", branch = "master" }
sideweave-plugin-ipc = { package = "sideweave-plugin-ipc", git = "https://github.com/suzikuo/SideWeave.git", branch = "master" }
